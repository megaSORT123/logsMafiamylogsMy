<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESCADRONE_RLS firmware generator</title>
    <!-- Подключаем MD5 для расчета Binding Phrase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1a1c1e; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #242629; width: 100%; max-width: 580px; border-radius: 12px; padding: 26px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .btn-icon { background: #2b2d30; border: none; color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .title-wrap { text-align: center; margin-bottom: 14px; }
        .badge { display: inline-block; background: #1a1c1e; color: #38bdf8; font-weight: 700; font-size: 11px; padding: 4px 12px; border-radius: 6px; margin-bottom: 8px; }
        h1 { font-size: 19px; font-weight: 700; color: #f1f5f9; }
        .alert-box { background: #2a2d32; border: 1px solid #373a40; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        select, input[type="text"] { width: 100%; background: #2b2d30; border: 1px solid #3f4246; color: #f1f5f9; padding: 9px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        select:focus, input[type="text"]:focus { border-color: #2563eb; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .target-header { display: flex; justify-content: space-between; align-items: center; }
        .link-add { color: #38bdf8; font-size: 12px; text-decoration: underline; cursor: pointer; }
        .btn-action { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-action:hover { background: #1d4ed8; }
        .btn-action:disabled { background: #475569; cursor: not-allowed; }
        #terminal { background: #181a1b; color: #4ade80; font-family: monospace; font-size: 11px; padding: 12px; border-radius: 6px; height: 160px; overflow-y: auto; margin-top: 14px; white-space: pre-wrap; border: 1px solid #2a2d32; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-top">
        <button class="btn-icon">⌂</button>
        <button class="btn-icon">☼</button>
    </div>

    <div class="title-wrap">
        <span class="badge">⚡ ESCADRONE</span>
        <h1>ESCADRONE_RLS firmware generator</h1>
    </div>

    <div class="alert-box">
        ℹ ESCADRONE_RLS web-flasher. Работает прямо в браузере через Type-C. Никаких сторонних программ и Python!
    </div>

    <div class="form-group">
        <label>Firmware</label>
        <select>
            <option>ESCADRONE_RLS 1.2.8</option>
            <option>ESCADRONE_RLS 1.3.0</option>
        </select>
    </div>

    <div class="form-group row-3">
        <div>
            <label>Device type</label>
            <select><option>RX</option><option>TX</option></select>
        </div>
        <div>
            <label>Frequency</label>
            <select><option>2400 MHz</option><option>915 MHz</option></select>
        </div>
        <div>
            <label>Brand</label>
            <select><option>ESCADRONE targets</option><option>FPV Mafia targets</option></select>
        </div>
    </div>

    <div class="form-group">
        <div class="target-header">
            <label>Target (.bin файл)</label>
            <span class="link-add" id="chooseFileBtn">+ выбрать свой .bin</span>
        </div>
        <select id="targetSelect">
            <option value="none">-- Нажмите "+ выбрать свой .bin" выше --</option>
        </select>
        <input type="file" id="fileInput" accept=".bin">
    </div>

    <div class="form-group row-2">
        <div>
            <label>Domain</label>
            <select><option>ISM2G4</option><option>EU868</option></select>
        </div>
        <div>
            <label>Custom binding phrase</label>
            <input type="text" id="bindPhrase" value="yellow">
        </div>
    </div>

    <button class="btn-action" id="flashBtn">⚡ FLASH VIA TYPE-C (BETAFLIGHT)</button>

    <div id="terminal">Готов к работе. Закройте Betaflight Configurator, подключите дрон по Type-C и нажмите кнопку.</div>
</div>

<script type="module">
    // Правильный импорт ES-модулей esptool-js
    import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.5.4/bundle.js";

    let rawBinBuffer = null;
    const term = document.getElementById('terminal');
    const btn = document.getElementById('flashBtn');
    const fileInput = document.getElementById('fileInput');

    function log(msg) {
        const d = new Date();
        const t = d.toTimeString().split(' ')[0];
        term.innerHTML += `[${t}] ${msg}\n`;
        term.scrollTop = term.scrollHeight;
    }

    document.getElementById('chooseFileBtn').onclick = () => fileInput.click();

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            rawBinBuffer = new Uint8Array(evt.target.result);
            const select = document.getElementById('targetSelect');
            select.innerHTML = '';
            const opt = document.createElement('option');
            opt.value = "custom";
            opt.innerText = `${file.name} (${rawBinBuffer.length} байт)`;
            select.appendChild(opt);
            log(`Загружен файл: ${file.name} (${rawBinBuffer.length} байт)`);
        };
        reader.readAsArrayBuffer(file);
    });

    function getElrsUid(phrase) {
        if (!phrase) return [0, 0, 0, 0, 0, 0];
        const hash = CryptoJS.MD5(`-DMY_BINDING_PHRASE="${phrase}"`).toString();
        const uid = [];
        for (let i = 0; i < 6; i++) {
            uid.push(parseInt(hash.substr(i * 2, 2), 16));
        }
        return uid;
    }

    function patchBin(buffer, phrase) {
        const magic = [0xBE, 0xEF, 0xBA, 0xBE];
        let patched = new Uint8Array(buffer);
        const uid = getElrsUid(phrase);

        for (let i = 0; i < patched.length - 10; i++) {
            if (patched[i] === magic[0] && patched[i+1] === magic[1] &&
                patched[i+2] === magic[2] && patched[i+3] === magic[3]) {
                for (let j = 0; j < 6; j++) {
                    patched[i + 4 + j] = uid[j];
                }
                log(`UID успешно пропатчен под фразу '${phrase}': [${uid.join(', ')}]`);
                break;
            }
        }
        return patched;
    }

    btn.onclick = async function() {
        if (!navigator.serial) {
            alert("Ваш браузер не поддерживает Web Serial! Используйте Chrome, Edge или Opera на ПК.");
            return;
        }

        if (!rawBinBuffer) {
            alert("Сначала нажмите '+ выбрать свой .bin' и укажите файл прошивки!");
            fileInput.click();
            return;
        }

        btn.disabled = true;

        try {
            log("Запрос доступа к COM-порту полётника (Type-C)...");
            const port = await navigator.serial.requestPort();

            // Шаг 1: вход в CLI Betaflight и активация Passthrough
            log("1. Подключение к полётному контроллеру...");
            await port.open({ baudRate: 115200 });

            const writer = port.writable.getWriter();
            const encoder = new TextEncoder();

            await writer.write(encoder.encode("\r\n#\r\n"));
            await new Promise(r => setTimeout(r, 200));
            await writer.write(encoder.encode("#\r\n"));
            await new Promise(r => setTimeout(r, 200));

            // Активация сквозного моста
            log("2. Запуск сквозного моста: serialpassthrough 0 115200");
            await writer.write(encoder.encode("serialpassthrough 0 115200\r\n"));
            await new Promise(r => setTimeout(r, 400));

            // CRSF Bootloader пакеты
            log("3. Отправка команды CRSF Bootloader...");
            const crsfBoot = new Uint8Array([0xEC, 0x04, 0x32, 0x62, 0x6C, 0x0A]);
            await writer.write(crsfBoot);
            await new Promise(r => setTimeout(r, 50));
            await writer.write(crsfBoot);
            await new Promise(r => setTimeout(r, 200));

            writer.releaseLock();
            await port.close();
            await new Promise(r => setTimeout(r, 300));

            // Шаг 2: прошивка через ESPLoader
            log("4. Инициализация ESPLoader в браузере...");
            const phrase = document.getElementById('bindPhrase').value.trim();
            const finalBin = patchBin(rawBinBuffer, phrase);

            let binString = "";
            for (let i = 0; i < finalBin.length; i++) {
                binString += String.fromCharCode(finalBin[i]);
            }

            const transport = new Transport(port, true);
            const esploader = new ESPLoader({
                transport: transport,
                baudrate: 115200,
                romBaudrate: 115200,
                terminal: {
                    clean: () => {},
                    writeLine: (data) => log(data),
                    write: (data) => log(data)
                }
            });

            log("5. Соединение с чипом приёмника...");
            await esploader.main();

            log("6. Запись прошивки по адресу 0x10000...");
            await esploader.writeFlash({
                fileArray: [{ data: binString, address: 0x10000 }],
                flashSize: "keep",
                flashMode: "dio",
                flashFreq: "40m",
                eraseAll: false,
                compress: true,
                reportProgress: (fileIndex, written, total) => {
                    const percent = Math.round((written / total) * 100);
                    if (percent % 25 === 0) log(`Прогресс записи: ${percent}%`);
                }
            });

            log("✔ ПРОШИВКА УСПЕШНО ЗАВЕРШЕНА!");
            alert(`Успех! Приёмник прошит с фразой '${phrase}'!`);

        } catch (err) {
            log(`✖ Ошибка: ${err.message || err}`);
            alert(`Ошибка: ${err.message || err}`);
        } finally {
            btn.disabled = false;
        }
    };
</script>

</body>
</html>
