<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESCADRONE_RLS firmware generator</title>
    <!-- Подключение esptool.js для работы с ESP32 прямо из браузера -->
    <script src="https://unpkg.com/esptool-js@0.4.3/bundle.js"></script>
    <!-- MD5 для вычисления Binding Phrase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #1a1c1e;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #242629;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .btn-icon {
            background: #2b2d30;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .badge {
            display: inline-block;
            background: #1a1c1e;
            color: #38bdf8;
            font-weight: 700;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-align: center;
        }
        .title-wrap {
            text-align: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f1f5f9;
        }
        .alert-box {
            background: #2a2d32;
            border: 1px solid #373a40;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.4;
            color: #94a3b8;
            margin-bottom: 18px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        select, input[type="text"] {
            width: 100%;
            background: #2b2d30;
            border: 1px solid #3f4246;
            color: #f1f5f9;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #2563eb;
        }
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .target-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .link-add {
            color: #38bdf8;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        .btn-action {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn-action:hover {
            background: #1d4ed8;
        }
        .btn-action:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #terminal {
            background: #181a1b;
            color: #4ade80;
            font-family: monospace;
            font-size: 11px;
            padding: 12px;
            border-radius: 6px;
            height: 160px;
            overflow-y: auto;
            margin-top: 14px;
            white-space: pre-wrap;
            border: 1px solid #2a2d32;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-top">
        <button class="btn-icon">⌂</button>
        <button class="btn-icon">☼</button>
    </div>

    <div class="title-wrap">
        <span class="badge">⚡ ESCADRONE</span>
        <h1>ESCADRONE_RLS firmware generator</h1>
    </div>

    <div class="alert-box">
        ℹ ESCADRONE_RLS web-flasher. Работает прямо в браузере через Type-C. Никаких сторонних программ и Python!
    </div>

    <div class="form-group">
        <label>Firmware</label>
        <select>
            <option>ESCADRONE_RLS 1.2.8</option>
            <option>ESCADRONE_RLS 1.3.0</option>
        </select>
    </div>

    <div class="form-group row-3">
        <div>
            <label>Device type</label>
            <select><option>RX</option><option>TX</option></select>
        </div>
        <div>
            <label>Frequency</label>
            <select><option>2400 MHz</option><option>915 MHz</option></select>
        </div>
        <div>
            <label>Brand</label>
            <select><option>ESCADRONE targets</option><option>FPV Mafia targets</option></select>
        </div>
    </div>

    <div class="form-group">
        <div class="target-header">
            <label>Target (.bin файл)</label>
            <span class="link-add" onclick="document.getElementById('fileInput').click()">+ выбрать свой .bin</span>
        </div>
        <select id="targetSelect">
            <option value="default">N24R_TD_D4_RX (ESP32 True Diversity)</option>
        </select>
        <input type="file" id="fileInput" accept=".bin">
    </div>

    <div class="form-group row-2">
        <div>
            <label>Domain</label>
            <select><option>ISM2G4</option><option>EU868</option></select>
        </div>
        <div>
            <label>Custom binding phrase</label>
            <input type="text" id="bindPhrase" value="yellow">
        </div>
    </div>

    <button class="btn-action" id="flashBtn" onclick="startTypeCFlash()">⚡ FLASH VIA TYPE-C (BETAFLIGHT)</button>

    <div id="terminal">Готов к работе. Подключите полётник по Type-C, закройте Betaflight Configurator и нажмите кнопку.</div>
</div>

<script>
    let rawBinBuffer = null;

    function log(msg) {
        const term = document.getElementById('terminal');
        const d = new Date();
        const t = d.toTimeString().split(' ')[0];
        term.innerHTML += `[${t}] ${msg}\n`;
        term.scrollTop = term.scrollHeight;
    }

    // Выбор локального файла .bin
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            rawBinBuffer = new Uint8Array(evt.target.result);
            const select = document.getElementById('targetSelect');
            const opt = document.createElement('option');
            opt.value = "custom";
            opt.innerText = file.name;
            select.appendChild(opt);
            select.value = "custom";
            log(`Загружен файл: ${file.name} (${rawBinBuffer.length} байт)`);
        };
        reader.readAsArrayBuffer(file);
    });

    // Расчет UID привязки ExpressLRS (MD5)
    function getElrsUid(phrase) {
        if (!phrase) return [0, 0, 0, 0, 0, 0];
        const hash = CryptoJS.MD5(`-DMY_BINDING_PHRASE="${phrase}"`).toString();
        const uid = [];
        for (let i = 0; i < 6; i++) {
            uid.push(parseInt(hash.substr(i * 2, 2), 16));
        }
        return uid;
    }

    // Патчинг байт в памяти
    function patchBin(buffer, phrase) {
        const magic = [0xBE, 0xEF, 0xBA, 0xBE];
        let patched = new Uint8Array(buffer);
        const uid = getElrsUid(phrase);

        for (let i = 0; i < patched.length - 10; i++) {
            if (patched[i] === magic[0] && patched[i+1] === magic[1] &&
                patched[i+2] === magic[2] && patched[i+3] === magic[3]) {
                for (let j = 0; j < 6; j++) {
                    patched[i + 4 + j] = uid[j];
                }
                log(`UID успешно пропатчен под фразу '${phrase}': [${uid.join(', ')}]`);
                break;
            }
        }
        return patched;
    }

    async function startTypeCFlash() {
        if (!navigator.serial) {
            alert("Ваш браузер не поддерживает Web Serial API! Откройте страницу через Google Chrome, Edge или Opera.");
            return;
        }

        if (!rawBinBuffer) {
            alert("Пожалуйста, сначала нажмите '+ выбрать свой .bin' и укажите файл прошивки!");
            document.getElementById('fileInput').click();
            return;
        }

        const btn = document.getElementById('flashBtn');
        btn.disabled = true;

        try {
            log("Запрос доступа к COM-порту Type-C...");
            const port = await navigator.serial.requestPort();
            
            // 1. Подключаемся на 115200 к Betaflight CLI
            log("1. Подключение к полётнику...");
            await port.open({ baudRate: 115200 });

            const writer = port.writable.getWriter();
            const encoder = new TextEncoder();

            // Вход в CLI
            await writer.write(encoder.encode("\r\n#\r\n"));
            await new Promise(r => setTimeout(r, 300));
            await writer.write(encoder.encode("#\r\n"));
            await new Promise(r => setTimeout(r, 300));

            // Активация serialpassthrough (UART1 / индекс 0)
            log("2. Активация сквозного моста: serialpassthrough 0 115200");
            await writer.write(encoder.encode("serialpassthrough 0 115200\r\n"));
            await new Promise(r => setTimeout(r, 400));

            // CRSF Bootloader пакеты сброса
            log("3. Перевод приёмника в Bootloader...");
            const crsfBoot = new Uint8Array([0xEC, 0x04, 0x32, 0x62, 0x6C, 0x0A]);
            await writer.write(crsfBoot);
            await new Promise(r => setTimeout(r, 100));
            await writer.write(crsfBoot);

            writer.releaseLock();
            await port.close();
            await new Promise(r => setTimeout(r, 400));

            // 2. Запуск esptool-js прямо в браузере
            log("4. Инициализация esptool в браузере...");
            const phrase = document.getElementById('bindPhrase').value.trim();
            const finalBin = patchBin(rawBinBuffer, phrase);

            // Преобразование байт в бинарную строку для esptool
            let binString = "";
            for (let i = 0; i < finalBin.length; i++) {
                binString += String.fromCharCode(finalBin[i]);
            }

            const transport = new esptooljs.Transport(port);
            const esploader = new esptooljs.ESPLoader(transport, 115200, {
                log: (...args) => log(args.join(' ')),
                debug: () => {},
                error: (...args) => log(`[ОШИБКА] ${args.join(' ')}`)
            });

            log("5. Соединение с ESP32...");
            await esploader.main_fn();

            log("6. Запись прошивки по адресу 0x10000...");
            await esploader.write_flash({
                fileArray: [{ data: binString, address: 0x10000 }],
                flash_size: 'keep',
                erase_all: false,
                compress: true,
                reportProgress: (fileIndex, written, total) => {
                    const percent = Math.round((written / total) * 100);
                    if (percent % 20 === 0) log(`Запись: ${percent}%`);
                }
            });

            log("✔ ПРОШИВКА УСПЕШНО ЗАВЕРШЕНА!");
            alert(`Готово! Приёмник прошит с фразой '${phrase}'!`);

        } catch (err) {
            log(`✖ Сбой: ${err.message || err}`);
            alert(`Ошибка: ${err.message || err}`);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
