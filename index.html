<script>
    let rawBinBuffer = null;
    const term = document.getElementById('terminal');
    const btn = document.getElementById('flashBtn');
    const fileInput = document.getElementById('fileInput');

    function log(msg) {
        const d = new Date();
        const t = d.toTimeString().split(' ')[0];
        term.innerHTML += `[${t}] ${msg}\n`;
        term.scrollTop = term.scrollHeight;
    }

    document.getElementById('chooseFileBtn').onclick = function() {
        fileInput.click();
    };

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            rawBinBuffer = new Uint8Array(evt.target.result);
            const select = document.getElementById('targetSelect');
            select.innerHTML = '';
            const opt = document.createElement('option');
            opt.value = "custom";
            opt.innerText = `${file.name} (${rawBinBuffer.length} байт)`;
            select.appendChild(opt);
            log(`Загружен файл: ${file.name} (${rawBinBuffer.length} байт)`);
        };
        reader.readAsArrayBuffer(file);
    });

    function getElrsUid(phrase) {
        if (!phrase) return [0, 0, 0, 0, 0, 0];
        const hash = CryptoJS.MD5(`-DMY_BINDING_PHRASE="${phrase}"`).toString();
        const uid = [];
        for (let i = 0; i < 6; i++) {
            uid.push(parseInt(hash.substr(i * 2, 2), 16));
        }
        return uid;
    }

    function patchBin(buffer, phrase) {
        const magic = [0xBE, 0xEF, 0xBA, 0xBE];
        let patched = new Uint8Array(buffer);
        const uid = getElrsUid(phrase);

        for (let i = 0; i < patched.length - 10; i++) {
            if (patched[i] === magic[0] && patched[i+1] === magic[1] &&
                patched[i+2] === magic[2] && patched[i+3] === magic[3]) {
                for (let j = 0; j < 6; j++) {
                    patched[i + 4 + j] = uid[j];
                }
                log(`UID успешно пропатчен под фразу '${phrase}': [${uid.join(', ')}]`);
                break;
            }
        }
        return patched;
    }

    btn.onclick = async function() {
        if (!navigator.serial) {
            alert("Ваш браузер не поддерживает Web Serial! Используйте Chrome или Edge.");
            return;
        }

        const espLib = window.esptooljs || window.esptool;
        if (!espLib) {
            alert("Библиотека esptool еще загружается. Подождите пару секунд.");
            return;
        }

        if (!rawBinBuffer) {
            alert("Сначала нажмите '+ выбрать свой .bin' и укажите файл прошивки!");
            fileInput.click();
            return;
        }

        btn.disabled = true;

        try {
            log("Запрос доступа к порту полётника (Type-C)...");
            const port = await navigator.serial.requestPort();

            // 1. Вход в Betaflight CLI на 115200
            log("1. Вход в CLI полётного контроллера...");
            await port.open({ baudRate: 115200 });

            const writer = port.writable.getWriter();
            const encoder = new TextEncoder();

            await writer.write(encoder.encode("\r\n#\r\n"));
            await new Promise(r => setTimeout(r, 250));
            await writer.write(encoder.encode("#\r\n"));
            await new Promise(r => setTimeout(r, 250));

            // Активируем мост на порт приёмника
            const targetBaud = 420000;
            log(`2. Активация сквозного моста: serialpassthrough 0 ${targetBaud}...`);
            await writer.write(encoder.encode(`serialpassthrough 0 ${targetBaud}\r\n`));
            await new Promise(r => setTimeout(r, 400));

            // CRSF bootloader команды на рабочей скорости
            log("3. Отправка команды перехода в Bootloader...");
            const crsfBoot = new Uint8Array([0xEC, 0x04, 0x32, 0x62, 0x6C, 0x0A]);
            const crsfBootAlt = new Uint8Array([0xC8, 0x04, 0x32, 0x62, 0x6C, 0x22]);
            for (let i = 0; i < 4; i++) {
                await writer.write(crsfBoot);
                await writer.write(crsfBootAlt);
                await new Promise(r => setTimeout(r, 40));
            }

            writer.releaseLock();
            await port.close();
            await new Promise(r => setTimeout(r, 300));

            // 2. Инициализация ESPLoader БЕЗ сброса полётника (no-reset)
            log("4. Инициализация esptool...");
            const phrase = document.getElementById('bindPhrase').value.trim();
            const finalBin = patchBin(rawBinBuffer, phrase);

            let binString = "";
            for (let i = 0; i < finalBin.length; i++) {
                binString += String.fromCharCode(finalBin[i]);
            }

            const transport = new espLib.Transport(port);
            
            // Отключаем автоматический сброс DTR/RTS, чтобы не рвать passthrough
            transport.reset = async function() {};

            const esploader = new espLib.ESPLoader(transport, targetBaud, {
                log: (...args) => log(args.join(' ')),
                debug: () => {},
                error: (...args) => log(`[ОШИБКА] ${args.join(' ')}`)
            });

            log("5. Подключение к ESP32...");
            // mode 'no-reset' предотвращает сброс контроллера
            await esploader.main_fn('no-reset');

            log("6. Запись прошивки (0x10000)...");
            await esploader.write_flash({
                fileArray: [{ data: binString, address: 0x10000 }],
                flash_size: 'keep',
                erase_all: false,
                compress: true,
                reportProgress: (fileIndex, written, total) => {
                    const percent = Math.round((written / total) * 100);
                    if (percent % 20 === 0) log(`Прогресс: ${percent}%`);
                }
            });

            log("✔ ПРОШИВКА УСПЕШНО ЗАВЕРШЕНА!");
            alert(`Готово! Приёмник прошит с фразой '${phrase}'!`);

        } catch (err) {
            log(`✖ Сбой: ${err.message || err}`);
            alert(`Ошибка: ${err.message || err}`);
        } finally {
            btn.disabled = false;
        }
    };
</script>
